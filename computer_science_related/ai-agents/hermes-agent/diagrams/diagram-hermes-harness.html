<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Agent Harness Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-paper-2: #ececec;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #7a8399;
      --color-accent:  #eb6c36;
      --color-accent-tint: rgba(235,108,54,0.08);
      --color-rule:    rgba(45,49,66,0.12);
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1120px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.2vw + 0.8rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--color-muted);
      margin-bottom: 1.8rem;
      max-width: 800px;
      line-height: 1.45;
    }

    .card {
      background: #ffffff;
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 1.5rem;
    }

    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">System Architecture · Diagram Design</p>
    <h1>Hermes Agent Harness Architecture</h1>
    <p class="subtitle">Complete system design of Nous Research's Hermes Agent: local-first execution, multi-channel gateways, autonomous tool loops, and 3 persistent local memory tiers.</p>

    <div class="card">
      <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hermes-harness-title hermes-harness-desc">
        <title id="hermes-harness-title">Hermes Agent Harness System Architecture</title>
        <desc id="hermes-harness-desc">Complete architectural diagram of Hermes agent harness runtime showing gateways, working memory, execution loop, and local storage.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

        <!-- 1. MULTI-CHANNEL GATEWAYS (LEFT COLUMN) -->
        <rect x="36" y="36" width="180" height="488" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="36" y="36" width="180" height="38" rx="6" fill="#ececec"/>
        <text x="48" y="60" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#2d3142" letter-spacing="0.12em">1. ENTRY GATEWAYS</text>

        <!-- Desktop App -->
        <rect x="48" y="88" width="156" height="52" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="58" y="108" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Desktop App &amp; CLI</text>
        <text x="58" y="122" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399">NATIVE TERMINAL / UI</text>

        <!-- WhatsApp Gateway -->
        <rect x="48" y="152" width="156" height="52" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="58" y="172" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">WhatsApp Bridge</text>
        <text x="58" y="186" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399">REMOTE MESSAGING</text>

        <!-- Telegram / Discord -->
        <rect x="48" y="216" width="156" height="52" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="58" y="236" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#4f5d75">Telegram / Discord</text>
        <text x="58" y="250" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399">CHAT WEBHOOKS</text>

        <!-- Gateway Logs -->
        <rect x="48" y="380" width="156" height="124" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="58" y="402" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" fill="#2d3142">GATEWAY LOGS</text>
        <text x="58" y="420" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">• Trajectory exports</text>
        <text x="58" y="436" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">• Error logging</text>
        <text x="58" y="452" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">• Session traces</text>
        <text x="58" y="474" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399">hermes/logs/</text>

        <!-- Connector to Working Memory -->
        <path d="M 216 114 L 260 114" fill="none" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 216 178 L 244 178 L 244 126 L 260 126" fill="none" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>


        <!-- 2. WORKING MEMORY & EXECUTION RUNTIME (MIDDLE COLUMN) -->
        <rect x="260" y="36" width="412" height="488" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="260" y="36" width="412" height="38" rx="6" fill="#2d3142"/>
        <text x="276" y="60" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#ffffff" letter-spacing="0.12em">2. HERMES AGENT RUNTIME &amp; LOOP HARNESS</text>

        <!-- Working Memory Window -->
        <rect x="276" y="88" width="380" height="76" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="290" y="108" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Active Working Memory</text>
        <text x="290" y="122" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399">CONTEXT COMPOSITION</text>
        <text x="290" y="140" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">System Persona (SOUL.md) + Active Skills + MEMORY.md Facts + Current Turn</text>

        <!-- Execution Loop -->
        <path d="M 466 164 L 466 186" fill="none" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arrow)"/>

        <rect x="276" y="186" width="380" height="236" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="290" y="208" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#eb6c36">Autonomous Tool Loop Engine</text>
        <text x="290" y="222" font-family="'Geist Mono', monospace" font-size="8" fill="#eb6c36">REASONING ──> TOOL DISPATCH ──> EVALUATION</text>

        <!-- Built-in Tools Grid -->
        <rect x="290" y="234" width="176" height="38" rx="3" fill="rgba(45,49,66,0.04)" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="298" y="250" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2d3142">Terminal / Shell</text>
        <text x="298" y="262" font-family="'Geist', sans-serif" font-size="8" fill="#7a8399">Local CLI execution</text>

        <rect x="478" y="234" width="166" height="38" rx="3" fill="rgba(45,49,66,0.04)" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="486" y="250" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2d3142">Browser Control</text>
        <text x="486" y="262" font-family="'Geist', sans-serif" font-size="8" fill="#7a8399">Web scraping &amp; search</text>

        <rect x="290" y="280" width="176" height="42" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="298" y="296" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="600" fill="#eb6c36">delegate_task</text>
        <text x="298" y="308" font-family="'Geist', sans-serif" font-size="8" fill="#2d3142">Spawns parallel subagents</text>
        <rect x="398" y="284" width="62" height="12" rx="2" fill="#eb6c36"/>
        <text x="402" y="293" font-family="'Geist Mono', monospace" font-size="6.5" font-weight="600" fill="#ffffff">PARALLEL</text>

        <rect x="478" y="280" width="166" height="42" rx="3" fill="rgba(45,49,66,0.04)" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="486" y="296" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2d3142">Claude Code CLI</text>
        <text x="486" y="308" font-family="'Geist', sans-serif" font-size="8" fill="#7a8399">Headless code generator</text>

        <rect x="290" y="330" width="176" height="38" rx="3" fill="rgba(45,49,66,0.04)" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="298" y="346" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2d3142">cron_job Scheduler</text>
        <text x="298" y="358" font-family="'Geist', sans-serif" font-size="8" fill="#7a8399">Time-based triggers</text>

        <rect x="478" y="330" width="166" height="38" rx="3" fill="rgba(45,49,66,0.04)" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="486" y="346" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2d3142">Skill Manager</text>
        <text x="486" y="358" font-family="'Geist', sans-serif" font-size="8" fill="#7a8399">Auto creates skills</text>

        <text x="290" y="394" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">Loop iterates autonomously until task is resolved, then outputs final response.</text>
        <text x="290" y="408" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399">Guardrail: Terminate loop on completion or error limit.</text>

        <!-- Response to Gateway -->
        <rect x="276" y="434" width="380" height="76" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="290" y="454" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">User Reply Dispatch</text>
        <text x="290" y="470" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">Formats final answer in Pikachu persona and transmits</text>
        <text x="290" y="484" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">back to Desktop UI or WhatsApp bridge.</text>


        <!-- 3. PERSISTENT LOCAL STORAGE (RIGHT COLUMN) -->
        <rect x="696" y="36" width="268" height="488" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="696" y="36" width="268" height="38" rx="6" fill="#ececec"/>
        <text x="712" y="60" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#2d3142" letter-spacing="0.12em">3. LOCAL DISK STORAGE</text>

        <!-- Pillar 1: Procedural Skills -->
        <rect x="712" y="88" width="236" height="88" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="724" y="108" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">Procedural Memory</text>
        <text x="724" y="122" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399">HERMES/SKILLS/*.MD</text>
        <text x="724" y="140" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">• SOUL.md (Pikachu Persona)</text>
        <text x="724" y="154" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">• video-prep.md, claude-cli.md</text>
        <text x="724" y="168" font-family="'Geist', sans-serif" font-size="9" fill="#eb6c36">Auto-created after &gt;5 tool calls</text>

        <!-- Pillar 2: Semantic Memory -->
        <rect x="712" y="186" width="236" height="88" rx="4" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="724" y="206" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#eb6c36">Semantic Memory</text>
        <text x="724" y="220" font-family="'Geist Mono', monospace" font-size="8" fill="#eb6c36">HERMES/MEMORIES/MEMORY.MD</text>
        <text x="724" y="238" font-family="'Geist', sans-serif" font-size="9.5" fill="#2d3142">• Durable facts (pytest preference)</text>
        <text x="724" y="252" font-family="'Geist', sans-serif" font-size="9.5" fill="#2d3142">• YouTube scraping quirks</text>
        <text x="724" y="266" font-family="'Geist', sans-serif" font-size="9.5" fill="#2d3142">• User profile attributes</text>

        <!-- Pillar 3: Episodic Memory -->
        <rect x="712" y="284" width="236" height="88" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="724" y="304" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">Episodic Memory</text>
        <text x="724" y="318" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399">HERMES/STATE.DB (SQLITE)</text>
        <text x="724" y="336" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">• Chronological turn records</text>
        <text x="724" y="350" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">• FTS5 keyword indexing</text>
        <text x="724" y="364" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">• Exact timestamped logs</text>

        <!-- Consolidation Daemon -->
        <rect x="712" y="382" width="236" height="128" rx="4" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="724" y="404" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">Consolidation Engine</text>
        <text x="724" y="418" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399">AUXILIARY NOUS MODEL</text>
        <text x="724" y="438" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">Runs off-peak distillation across</text>
        <text x="724" y="452" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">unmerged state.db chat history;</text>
        <text x="724" y="466" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">extracts high-signal facts into</text>
        <text x="724" y="480" font-family="'Geist Mono', monospace" font-size="8" fill="#eb6c36">MEMORY.md</text>

        <!-- Storage Connectors -->
        <path d="M 656 126 L 712 126" fill="none" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 656 226 L 712 226" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M 656 324 L 712 324" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      </svg>
    </div>
  </div>
</body>
</html>
