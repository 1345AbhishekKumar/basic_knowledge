<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Horse vs. Harness Mental Model</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-paper-2: #ececec;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #7a8399;
      --color-accent:  #eb6c36;
      --color-accent-tint: rgba(235,108,54,0.08);
      --color-rule:    rgba(45,49,66,0.12);
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1100px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.2vw + 0.8rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--color-muted);
      margin-bottom: 1.8rem;
      max-width: 780px;
      line-height: 1.45;
    }

    .card {
      background: #ffffff;
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 1.5rem;
    }

    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Conceptual Mental Model · Diagram Design</p>
    <h1>The "Horse vs. Harness" Agent Framework</h1>
    <p class="subtitle">Why the raw LLM is just the engine (the horse), while the agent harness provides the bridle, reins, memory storage, and toolbelt needed to steer it toward real goals.</p>

    <div class="card">
      <svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="horse-harness-title horse-harness-desc">
        <title id="horse-harness-title">The Horse vs Harness Framework</title>
        <desc id="horse-harness-desc">Visual comparison distinguishing the raw LLM engine (the horse) from the surrounding agent harness.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

        <!-- LEFT: THE RAW LLM (THE HORSE) -->
        <rect x="36" y="32" width="380" height="436" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="36" y="32" width="380" height="40" rx="6" fill="#ececec"/>
        <text x="52" y="56" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" fill="#4f5d75" letter-spacing="0.12em">1. THE RAW LLM (THE HORSE)</text>

        <!-- Horse traits -->
        <rect x="56" y="92" width="340" height="68" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="68" y="112" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">Raw Computational Muscle</text>
        <text x="68" y="128" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">GEMINI 3.1 · CLAUDE 3.5 · NOUS HERMES</text>
        <text x="68" y="146" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">Incredible semantic reasoning, language fluency, and code generation.</text>

        <rect x="56" y="172" width="340" height="68" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="68" y="192" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">Inherent Statelessness</text>
        <text x="68" y="208" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">ZERO LONG-TERM PERSISTENCE</text>
        <text x="68" y="226" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">Each API call is isolated; forgets previous chats immediately.</text>

        <rect x="56" y="252" width="340" height="68" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="68" y="272" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">Unconstrained &amp; Drifting</text>
        <text x="68" y="288" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">NO NATIVE PERIPHERALS</text>
        <text x="68" y="306" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">Cannot access local terminal, run files, or schedule cron jobs alone.</text>

        <text x="56" y="360" font-family="'Instrument Serif', serif" font-style="italic" font-size="14" fill="#4f5d75">"A powerful horse in a wild field goes nowhere without direction."</text>


        <!-- RIGHT: THE AGENT HARNESS (THE GEAR & REINS) -->
        <rect x="448" y="32" width="476" height="436" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="448" y="32" width="476" height="40" rx="6" fill="#eb6c36"/>
        <text x="464" y="56" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" fill="#ffffff" letter-spacing="0.12em">2. THE AGENT HARNESS (THE SADDLE &amp; REINS)</text>

        <!-- Harness gear 1 -->
        <rect x="468" y="92" width="436" height="68" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
        <text x="480" y="112" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#eb6c36">The Bridle: Multi-Channel Gateways</text>
        <text x="480" y="128" font-family="'Geist Mono', monospace" font-size="8.5" fill="#eb6c36">WHATSAPP · DESKTOP APP · CLI · DISCORD</text>
        <text x="480" y="146" font-family="'Geist', sans-serif" font-size="9.5" fill="#2d3142">Enables seamless remote control and two-way interaction.</text>

        <!-- Harness gear 2 -->
        <rect x="468" y="172" width="436" height="68" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
        <text x="480" y="192" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#eb6c36">The Saddle: Local Persistent Memory</text>
        <text x="480" y="208" font-family="'Geist Mono', monospace" font-size="8.5" fill="#eb6c36">SOUL.MD · MEMORY.MD · STATE.DB</text>
        <text x="480" y="226" font-family="'Geist', sans-serif" font-size="9.5" fill="#2d3142">Stores procedural rules, durable facts, and conversation history.</text>

        <!-- Harness gear 3 -->
        <rect x="468" y="252" width="436" height="68" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
        <text x="480" y="272" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#eb6c36">The Toolbelt: Autonomous Loop Execution</text>
        <text x="480" y="288" font-family="'Geist Mono', monospace" font-size="8.5" fill="#eb6c36">TERMINAL · BROWSER · CLAUDE CLI · CRON</text>
        <text x="480" y="306" font-family="'Geist', sans-serif" font-size="9.5" fill="#2d3142">Equips the horse to execute real actions and evaluate outcomes.</text>

        <!-- Summary -->
        <text x="468" y="360" font-family="'Instrument Serif', serif" font-style="italic" font-size="14" fill="#eb6c36">"The harness saddles the horse, steers its power, and preserves its memory."</text>

        <rect x="468" y="388" width="436" height="60" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="480" y="408" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="600" fill="#2d3142">TAKEAWAY</text>
        <text x="480" y="426" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">Don't overcomplicate the buzzword: 'Harness' is simply the runtime</text>
        <text x="480" y="440" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">wrapper that turns a raw LLM into a disciplined, self-improving agent.</text>

      </svg>
    </div>
  </div>
</body>
</html>
