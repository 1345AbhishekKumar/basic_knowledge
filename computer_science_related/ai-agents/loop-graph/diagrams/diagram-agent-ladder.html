<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The 5-Step AI Agent Engineering Ladder</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-paper-2: #ececec;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #7a8399;
      --color-accent:  #eb6c36;
      --color-accent-tint: rgba(235,108,54,0.08);
      --color-rule:    rgba(45,49,66,0.12);
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1100px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.2vw + 0.8rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--color-muted);
      margin-bottom: 1.8rem;
      max-width: 780px;
      line-height: 1.45;
    }

    .card {
      background: #ffffff;
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 1.5rem;
    }

    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Evolutionary Architecture · Diagram Design</p>
    <h1>The 5-Step AI Agent Engineering Ladder</h1>
    <p class="subtitle">From prompt role-playing to deterministic graph topologies: how the industry evolved from prompt engineering to autonomous loops and hybrid graph engineering.</p>

    <div class="card">
      <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ladder-title ladder-desc">
        <title id="ladder-title">The 5-Step AI Agent Engineering Ladder</title>
        <desc id="ladder-desc">Diagram showing the progression from Prompt Engineering, Context Engineering, Skills, Loops, to Graph Engineering.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

        <!-- STAGE 1: PROMPT ENGINEERING (2022) -->
        <rect x="32" y="40" width="172" height="440" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="32" y="40" width="172" height="40" rx="6" fill="#ececec"/>
        <text x="44" y="64" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#4f5d75">STAGE 01 · 2022</text>
        
        <text x="44" y="104" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#2d3142">Prompt Eng</text>
        <text x="44" y="122" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">"ROLE-PLAYING"</text>
        
        <rect x="44" y="136" width="148" height="88" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="52" y="156" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">"Act as Shakespeare / Li Bai."</text>
        <text x="52" y="174" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">Steers tone and output</text>
        <text x="52" y="190" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">style through persona</text>
        <text x="52" y="206" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">prompt constraints.</text>

        <text x="44" y="250" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" fill="#2d3142">CORE LIMITATION</text>
        <text x="44" y="270" font-family="'Geist', sans-serif" font-size="9.5" fill="#7a8399">Zero access to enterprise data</text>
        <text x="44" y="286" font-family="'Geist', sans-serif" font-size="9.5" fill="#7a8399">or live external state.</text>

        <!-- STAGE 2: CONTEXT ENGINEERING (2023) -->
        <rect x="224" y="40" width="172" height="440" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="224" y="40" width="172" height="40" rx="6" fill="#ececec"/>
        <text x="236" y="64" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#4f5d75">STAGE 02 · 2023</text>

        <text x="236" y="104" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#2d3142">Context Eng</text>
        <text x="236" y="122" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">"DATA INJECTION"</text>

        <rect x="236" y="136" width="148" height="88" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="244" y="156" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">Feeding CRMs, Excel,</text>
        <text x="244" y="174" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">documents, and RAG into</text>
        <text x="244" y="190" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">the context window for</text>
        <text x="244" y="206" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">factual business ground.</text>

        <text x="236" y="250" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" fill="#2d3142">CORE LIMITATION</text>
        <text x="236" y="270" font-family="'Geist', sans-serif" font-size="9.5" fill="#7a8399">Repetitive prompt orders</text>
        <text x="236" y="286" font-family="'Geist', sans-serif" font-size="9.5" fill="#7a8399">wasting token budget.</text>

        <!-- STAGE 3: SKILLS (2024) -->
        <rect x="416" y="40" width="172" height="440" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="416" y="40" width="172" height="40" rx="6" fill="#ececec"/>
        <text x="428" y="64" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#4f5d75">STAGE 03 · 2024</text>

        <text x="428" y="104" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#2d3142">Skills &amp; SOPs</text>
        <text x="428" y="122" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">"PROCEDURAL MEMORY"</text>

        <rect x="428" y="136" width="148" height="88" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="436" y="156" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">Reusable SOPs &amp; rules.</text>
        <text x="436" y="174" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">"Walk on right side in US."</text>
        <text x="436" y="190" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">Triggered on-demand</text>
        <text x="436" y="206" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">without repeated prompt.</text>

        <text x="428" y="250" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" fill="#2d3142">CORE LIMITATION</text>
        <text x="428" y="270" font-family="'Geist', sans-serif" font-size="9.5" fill="#7a8399">Cannot solve open goals</text>
        <text x="428" y="286" font-family="'Geist', sans-serif" font-size="9.5" fill="#7a8399">where steps are unknown.</text>

        <!-- STAGE 4: LOOPS (2025) -->
        <rect x="608" y="40" width="172" height="440" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="608" y="40" width="172" height="40" rx="6" fill="#2d3142"/>
        <text x="620" y="64" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#ffffff">STAGE 04 · 2025</text>

        <text x="620" y="104" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#2d3142">Loop Eng</text>
        <text x="620" y="122" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">"AUTONOMOUS GOALS"</text>

        <rect x="620" y="136" width="148" height="88" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="628" y="156" font-family="'Geist', sans-serif" font-size="9.5" fill="#2d3142">LLM reasoning loop + MCP</text>
        <text x="628" y="174" font-family="'Geist', sans-serif" font-size="9.5" fill="#2d3142">tools. "Fix this bug on PR."</text>
        <text x="628" y="190" font-family="'Geist', sans-serif" font-size="9.5" fill="#2d3142">Model picks next tool</text>
        <text x="628" y="206" font-family="'Geist', sans-serif" font-size="9.5" fill="#2d3142">step-by-step until done.</text>

        <text x="620" y="250" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" fill="#2d3142">CORE LIMITATION</text>
        <text x="620" y="270" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">High latency &amp; non-linear</text>
        <text x="620" y="286" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">drift on fixed workflows.</text>

        <!-- STAGE 5: GRAPHS (2026+) - FOCAL HIGHLIGHT -->
        <rect x="800" y="40" width="172" height="440" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.4"/>
        <rect x="800" y="40" width="172" height="40" rx="6" fill="#eb6c36"/>
        <text x="812" y="64" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#ffffff">STAGE 05 · 2026+</text>

        <text x="812" y="104" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#eb6c36">Graph Eng</text>
        <text x="812" y="122" font-family="'Geist Mono', monospace" font-size="8.5" fill="#eb6c36">"TOPOLOGICAL HYBRID"</text>

        <rect x="812" y="136" width="148" height="88" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
        <text x="820" y="156" font-family="'Geist', sans-serif" font-size="9.5" fill="#2d3142">Structured graph topology</text>
        <text x="820" y="174" font-family="'Geist', sans-serif" font-size="9.5" fill="#2d3142">+ parallel node execution</text>
        <text x="820" y="190" font-family="'Geist', sans-serif" font-size="9.5" fill="#2d3142">+ embedded agent loops</text>
        <text x="820" y="206" font-family="'Geist', sans-serif" font-size="9.5" fill="#2d3142">for known corporate SOPs.</text>

        <text x="812" y="250" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" fill="#eb6c36">ENGINEERING VALUE</text>
        <text x="812" y="270" font-family="'Geist', sans-serif" font-size="9.5" fill="#2d3142">Parallel fan-out execution,</text>
        <text x="812" y="286" font-family="'Geist', sans-serif" font-size="9.5" fill="#2d3142">guaranteed deterministic steps.</text>

        <!-- Connecting Step Arrows -->
        <path d="M 204 60 L 224 60" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 396 60 L 416 60" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 588 60 L 608 60" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 780 60 L 800 60" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- Bottom Editorial Callout -->
        <text x="44" y="440" font-family="'Instrument Serif', serif" font-style="italic" font-size="14" fill="#eb6c36">"Loops discover what to do step-by-step; Graphs structure known topologies to move concurrently."</text>
      </svg>
    </div>
  </div>
</body>
</html>
