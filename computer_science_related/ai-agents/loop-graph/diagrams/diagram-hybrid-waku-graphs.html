<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production Agent Graphs: Triage &amp; Gather Workflows</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-paper-2: #ececec;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #7a8399;
      --color-accent:  #eb6c36;
      --color-accent-tint: rgba(235,108,54,0.08);
      --color-rule:    rgba(45,49,66,0.12);
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1120px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.2vw + 0.8rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--color-muted);
      margin-bottom: 1.8rem;
      max-width: 800px;
      line-height: 1.45;
    }

    .card {
      background: #ffffff;
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 1.5rem;
    }

    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Workflows &amp; Topologies · Diagram Design</p>
    <h1>Production Agent Graphs: Triage &amp; Gather</h1>
    <p class="subtitle">Real-world graph topologies from Waku Agent illustrating intent-routing triage graphs and parallel fan-out gather workflows.</p>

    <div class="card">
      <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="waku-graphs-title waku-graphs-desc">
        <title id="waku-graphs-title">Production Agent Graphs in Waku Agent</title>
        <desc id="waku-graphs-desc">Diagram showing Triage Graph with intent classification and Gather Graph with parallel fan-out gathering.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

        <!-- GRAPH 1: TRIAGE WORKFLOW -->
        <rect x="36" y="32" width="440" height="456" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="36" y="32" width="440" height="40" rx="6" fill="#ececec"/>
        <text x="52" y="56" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" fill="#2d3142" letter-spacing="0.12em">1. TRIAGE GRAPH (INTENT ROUTER)</text>

        <!-- Start Node -->
        <rect x="56" y="92" width="120" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="68" y="112" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">User Input</text>
        <text x="68" y="124" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399">"WHAT'S UP TODAY?"</text>

        <!-- Split Arrows -->
        <path d="M 176 112 L 232 98" fill="none" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 176 112 L 232 144" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- Parallel Branch A: Calendar Check -->
        <rect x="232" y="78" width="224" height="44" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="244" y="96" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="600" fill="#2d3142">Node: Check Calendar</text>
        <text x="244" y="110" font-family="'Geist', sans-serif" font-size="8.5" fill="#7a8399">Reads Google/Apple Calendar</text>

        <!-- Parallel Branch B: Intent Classifier (Focal) -->
        <rect x="232" y="132" width="224" height="52" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="244" y="152" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="600" fill="#eb6c36">Node: Intent Classifier</text>
        <text x="244" y="168" font-family="'Geist', sans-serif" font-size="8.5" fill="#2d3142">Evaluates complexity &amp; agent need</text>

        <!-- Routing Decision -->
        <path d="M 344 184 L 344 216" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- Router Node -->
        <rect x="232" y="216" width="224" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="244" y="234" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Decision Gateway</text>
        <text x="244" y="248" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399">SIMPLE VS HEAVY TOOL CALL</text>

        <!-- Branch 1: Direct Return -->
        <path d="M 232 236 L 160 236 L 160 292" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="76" y="292" width="168" height="60" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="88" y="312" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="600" fill="#4f5d75">Path A: Fast Direct</text>
        <text x="88" y="328" font-family="'Geist', sans-serif" font-size="8.5" fill="#7a8399">Returns calendar list</text>
        <text x="88" y="342" font-family="'Geist', sans-serif" font-size="8.5" fill="#7a8399">without agent loop</text>

        <!-- Branch 2: Dispatch Heavy Agent Loop -->
        <path d="M 456 236 L 468 236 L 468 292 L 396 292" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="264" y="292" width="192" height="72" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="276" y="312" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="600" fill="#eb6c36">Path B: Agent Loop</text>
        <text x="276" y="328" font-family="'Geist', sans-serif" font-size="8.5" fill="#2d3142">Dispatches multi-tool loop</text>
        <text x="276" y="342" font-family="'Geist', sans-serif" font-size="8.5" fill="#2d3142">for deep reasoning</text>
        <rect x="364" y="346" width="84" height="14" rx="2" fill="#eb6c36"/>
        <text x="370" y="356" font-family="'Geist Mono', monospace" font-size="7" font-weight="600" fill="#ffffff">MULTI-STEP LOOP</text>

        <text x="56" y="440" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">Triage routes light queries to fast zero-loop execution.</text>


        <!-- GRAPH 2: GATHER WORKFLOW (/gather) -->
        <rect x="508" y="32" width="456" height="456" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="508" y="32" width="456" height="40" rx="6" fill="#ececec"/>
        <text x="524" y="56" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" fill="#2d3142" letter-spacing="0.12em">2. GATHER GRAPH (PARALLEL MORNING BRIEF)</text>

        <!-- Start Node -->
        <rect x="528" y="92" width="136" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="540" y="112" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Trigger /gather</text>
        <text x="540" y="124" font-family="'Geist Mono', monospace" font-size="8" fill="#eb6c36">SCHEDULED OR PROMPT</text>

        <!-- Fan-out lines -->
        <path d="M 664 112 L 720 90" fill="none" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 664 112 L 720 146" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M 664 112 L 720 202" fill="none" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 664 112 L 720 258" fill="none" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- 4 Concurrent Nodes -->
        <rect x="720" y="72" width="224" height="38" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="732" y="88" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2d3142">1. Scan GitHub PRs</text>
        <text x="732" y="100" font-family="'Geist', sans-serif" font-size="8" fill="#7a8399">Pulls pending reviews (1.2s)</text>

        <rect x="720" y="128" width="224" height="48" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="732" y="146" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="600" fill="#eb6c36">2. Competitor Web Research</text>
        <text x="732" y="160" font-family="'Geist', sans-serif" font-size="8" fill="#2d3142">Multi-step autonomous web loop (3.8s)</text>

        <rect x="720" y="184" width="224" height="38" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="732" y="200" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2d3142">3. Google Calendar</text>
        <text x="732" y="212" font-family="'Geist', sans-serif" font-size="8" fill="#7a8399">Pulls today's schedule (0.4s)</text>

        <rect x="720" y="240" width="224" height="38" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="732" y="256" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2d3142">4. Memory Recall</text>
        <text x="732" y="268" font-family="'Geist', sans-serif" font-size="8" fill="#7a8399">Recalls durable user facts (0.1s)</text>

        <!-- Fan-In Join Line -->
        <path d="M 832 278 L 832 312" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- Synthesis & Evaluation Node -->
        <rect x="720" y="312" width="224" height="58" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <text x="732" y="332" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Synthesis &amp; Eval Engine</text>
        <text x="732" y="348" font-family="'Geist', sans-serif" font-size="8.5" fill="#4f5d75">Joins all 4 parallel payloads into a unified</text>
        <text x="732" y="360" font-family="'Geist', sans-serif" font-size="8.5" fill="#4f5d75">structured morning briefing document.</text>

        <text x="528" y="440" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">Total wall-clock latency = Max(Nodes) ~ 3.8s instead of 5.5s sequential.</text>

      </svg>
    </div>
  </div>
</body>
</html>
