<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loop Engineering vs Graph Engineering</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-paper-2: #ececec;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #7a8399;
      --color-accent:  #eb6c36;
      --color-accent-tint: rgba(235,108,54,0.08);
      --color-rule:    rgba(45,49,66,0.12);
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1120px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.2vw + 0.8rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--color-muted);
      margin-bottom: 1.8rem;
      max-width: 780px;
      line-height: 1.45;
    }

    .card {
      background: #ffffff;
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 1.5rem;
    }

    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Paradigm Comparison · Diagram Design</p>
    <h1>Loop Engineering vs Graph Engineering</h1>
    <p class="subtitle">Contrasting dynamic step-by-step discovery against predefined topological workflows—and showing how they coexist in production AI harnesses.</p>

    <div class="card">
      <svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-graph-title loop-graph-desc">
        <title id="loop-graph-title">Loop vs Graph Engineering Comparison</title>
        <desc id="loop-graph-desc">Side-by-side comparison of autonomous agent loops and topological graph workflows.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

        <!-- LEFT PANEL: LOOP ENGINEERING -->
        <rect x="36" y="32" width="440" height="476" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="36" y="32" width="440" height="44" rx="6" fill="#ececec"/>
        <text x="52" y="58" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#2d3142" letter-spacing="0.12em">A. LOOP ENGINEERING (DISCOVERY)</text>

        <!-- User Prompt -->
        <rect x="56" y="96" width="168" height="44" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="68" y="116" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">User Goal / Task</text>
        <text x="68" y="130" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399">"FIX PR #42 ON GITHUB"</text>

        <path d="M 224 118 L 268 118" fill="none" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- LLM Reasoner Box -->
        <rect x="268" y="96" width="188" height="60" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="118" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">LLM Reasoner</text>
        <text x="280" y="132" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">"DO I NEED A TOOL?"</text>
        <text x="280" y="146" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">Selects 1 tool dynamically</text>

        <!-- Sequential Tool Call Steps -->
        <path d="M 362 156 L 362 188" fill="none" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
        
        <rect x="268" y="188" width="188" height="40" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="280" y="206" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2d3142">Step 1: git checkout &amp; test</text>
        <text x="280" y="220" font-family="'Geist', sans-serif" font-size="8.5" fill="#7a8399">Returns error logs</text>

        <path d="M 268 208 L 244 208 L 244 140 L 268 140" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

        <path d="M 362 228 L 362 252" fill="none" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>

        <rect x="268" y="252" width="188" height="40" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="280" y="270" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2d3142">Step 2: search codebase</text>
        <text x="280" y="284" font-family="'Geist', sans-serif" font-size="8.5" fill="#7a8399">Finds failing function</text>

        <path d="M 268 272 L 236 272 L 236 148 L 268 148" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

        <path d="M 362 292 L 362 316" fill="none" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>

        <rect x="268" y="316" width="188" height="40" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="280" y="334" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2d3142">Step 3: patch &amp; commit</text>
        <text x="280" y="348" font-family="'Geist', sans-serif" font-size="8.5" fill="#7a8399">Tests pass! Goal complete.</text>

        <!-- Final Reply -->
        <path d="M 362 356 L 362 384" fill="none" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
        
        <rect x="268" y="384" width="188" height="36" rx="4" fill="rgba(45,49,66,0.06)" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="406" font-family="'Geist', sans-serif" font-size="10.5" font-weight="600" fill="#2d3142">Final Answer / Resolution</text>

        <!-- Loop Properties -->
        <text x="56" y="446" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">• Step sequence is unknown in advance.</text>
        <text x="56" y="462" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">• Model decides each tool call one by one.</text>
        <text x="56" y="478" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">• Ideal for: debugging, research, exploration.</text>


        <!-- RIGHT PANEL: GRAPH ENGINEERING -->
        <rect x="508" y="32" width="456" height="476" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="508" y="32" width="456" height="44" rx="6" fill="#eb6c36"/>
        <text x="524" y="58" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#ffffff" letter-spacing="0.12em">B. GRAPH ENGINEERING (TOPOLOGY)</text>

        <!-- Trigger Node -->
        <rect x="528" y="96" width="136" height="44" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
        <text x="540" y="116" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Workflow Trigger</text>
        <text x="540" y="130" font-family="'Geist Mono', monospace" font-size="8" fill="#eb6c36">/GATHER COMMAND</text>

        <!-- Parallel Fan-Out Arrows -->
        <path d="M 664 118 L 712 100" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M 664 118 L 712 160" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M 664 118 L 712 220" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M 664 118 L 712 280" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- Parallel Nodes -->
        <!-- Node 1: GitHub -->
        <rect x="712" y="80" width="228" height="42" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="724" y="98" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="600" fill="#2d3142">Node 1: Scan GitHub PRs</text>
        <text x="724" y="112" font-family="'Geist', sans-serif" font-size="8.5" fill="#7a8399">Parallel Execution (1.2s)</text>

        <!-- Node 2: Web Search (Embedded Loop) -->
        <rect x="712" y="136" width="228" height="50" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="724" y="154" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="600" fill="#eb6c36">Node 2: Web Competitor Search</text>
        <text x="724" y="168" font-family="'Geist', sans-serif" font-size="8.5" fill="#2d3142">Embedded Agent Loop (3.8s)</text>
        <rect x="856" y="142" width="76" height="14" rx="2" fill="#eb6c36"/>
        <text x="862" y="152" font-family="'Geist Mono', monospace" font-size="7" font-weight="600" fill="#ffffff">INNER LOOP</text>

        <!-- Node 3: Calendar Check -->
        <rect x="712" y="200" width="228" height="42" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="724" y="218" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="600" fill="#2d3142">Node 3: Check Google Calendar</text>
        <text x="724" y="232" font-family="'Geist', sans-serif" font-size="8.5" fill="#7a8399">Parallel Execution (0.4s)</text>

        <!-- Node 4: Memory Recall -->
        <rect x="712" y="258" width="228" height="42" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="724" y="276" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="600" fill="#2d3142">Node 4: Retrieve Semantic Memory</text>
        <text x="724" y="290" font-family="'Geist', sans-serif" font-size="8.5" fill="#7a8399">Local SQLite Recall (0.1s)</text>

        <!-- Fan-In Join Arrows -->
        <path d="M 826 300 L 826 336" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- Synthesis Node -->
        <rect x="712" y="336" width="228" height="52" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="724" y="356" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">Synthesis &amp; Eval Node</text>
        <text x="724" y="372" font-family="'Geist', sans-serif" font-size="9" fill="#4f5d75">Combines all 4 streams into Morning Brief</text>

        <!-- Graph Properties -->
        <text x="528" y="446" font-family="'Geist', sans-serif" font-size="10" fill="#2d3142">• Workflow topology is fixed &amp; predetermined.</text>
        <text x="528" y="462" font-family="'Geist', sans-serif" font-size="10" fill="#2d3142">• Runs nodes concurrently to minimize wall-clock latency.</text>
        <text x="528" y="478" font-family="'Geist', sans-serif" font-size="10" fill="#2d3142">• Can embed inner agent loops inside individual nodes.</text>

      </svg>
    </div>
  </div>
</body>
</html>
