<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2023 Airflow DAGs vs 2026 Agentic Graph Engineering</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-paper-2: #ececec;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #7a8399;
      --color-accent:  #eb6c36;
      --color-accent-tint: rgba(235,108,54,0.08);
      --color-rule:    rgba(45,49,66,0.12);
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1120px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.2vw + 0.8rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--color-muted);
      margin-bottom: 1.8rem;
      max-width: 800px;
      line-height: 1.45;
    }

    .card {
      background: #ffffff;
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 1.5rem;
    }

    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architectural Dissection · Diagram Design</p>
    <h1>2023 Airflow DAGs vs 2026 Agentic Graphs</h1>
    <p class="subtitle">Why agentic graph engineering is fundamentally distinct from legacy workflow DAGs: non-deterministic node reasoning, dynamic LLM edge routing, and runtime semantic guards.</p>

    <div class="card">
      <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="airflow-diff-title airflow-diff-desc">
        <title id="airflow-diff-title">Airflow DAGs vs Agentic Graphs</title>
        <desc id="airflow-diff-desc">Comparison of static deterministic DAGs vs AI agent graphs with LLM nodes and routing.</desc>

        <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

        <!-- LEFT PANEL: 2023 AIRFLOW / STEP FUNCTIONS -->
        <rect x="36" y="32" width="440" height="456" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="36" y="32" width="440" height="40" rx="6" fill="#ececec"/>
        <text x="52" y="56" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" fill="#4f5d75" letter-spacing="0.12em">1. 2023 AIRFLOW / STATIC DAGS</text>

        <!-- Node 1 -->
        <rect x="56" y="92" width="400" height="68" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="68" y="112" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">100% Deterministic Python / Bash Nodes</text>
        <text x="68" y="128" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">OPERATORS · PURE FUNCTIONS</text>
        <text x="68" y="146" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">Given input X, output Y is 100% mathematically fixed.</text>

        <!-- Node 2 -->
        <rect x="56" y="172" width="400" height="68" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="68" y="192" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">Rigid, Hard-Coded Conditionals</text>
        <text x="68" y="208" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">IF STATUS == 200 ROUTING</text>
        <text x="68" y="226" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">Branching based strictly on boolean flags and status codes.</text>

        <!-- Node 3 -->
        <rect x="56" y="252" width="400" height="68" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="68" y="272" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">Syntactic Error Handling</text>
        <text x="68" y="288" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">RETRY ON TIMEOUT / 500 ERROR</text>
        <text x="68" y="306" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">Cannot evaluate semantic hallucination or logical drift.</text>

        <!-- Summary -->
        <rect x="56" y="336" width="400" height="132" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="68" y="358" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="600" fill="#2d3142">ARCHITECTURAL ROLE</text>
        <text x="68" y="378" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">Batch ETL data pipelines, database migrations, and</text>
        <text x="68" y="394" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">cron scheduling where randomness is an explicit defect.</text>
        <text x="68" y="420" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399">NO COGNITIVE REASONING · ZERO MODEL ADAPTATION</text>


        <!-- RIGHT PANEL: 2026 AGENTIC GRAPH ENGINEERING -->
        <rect x="508" y="32" width="456" height="456" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="508" y="32" width="456" height="40" rx="6" fill="#eb6c36"/>
        <text x="524" y="56" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" fill="#ffffff" letter-spacing="0.12em">2. 2026 AGENTIC GRAPH HARNESSES</text>

        <!-- Feature 1 -->
        <rect x="528" y="92" width="416" height="68" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
        <text x="540" y="112" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#eb6c36">Non-Deterministic &amp; Loop Nodes</text>
        <text x="540" y="128" font-family="'Geist Mono', monospace" font-size="8.5" fill="#eb6c36">LLM REASONERS · AGENT SUB-LOOPS</text>
        <text x="540" y="146" font-family="'Geist', sans-serif" font-size="9.5" fill="#2d3142">Nodes can be autonomous multi-turn agents or web searchers.</text>

        <!-- Feature 2 -->
        <rect x="528" y="172" width="416" height="68" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
        <text x="540" y="192" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#eb6c36">Dynamic Model-Driven Edge Selection</text>
        <text x="540" y="208" font-family="'Geist Mono', monospace" font-size="8.5" fill="#eb6c36">LLM-AS-A-JUDGE ROUTING</text>
        <text x="540" y="226" font-family="'Geist', sans-serif" font-size="9.5" fill="#2d3142">Model dynamically evaluates intent and chooses optimal path.</text>

        <!-- Feature 3 -->
        <rect x="528" y="252" width="416" height="68" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
        <text x="540" y="272" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#eb6c36">Runtime Semantic Guards &amp; Evals</text>
        <text x="540" y="288" font-family="'Geist Mono', monospace" font-size="8.5" fill="#eb6c36">COGNITIVE SAFETY &amp; STATE AUDIT</text>
        <text x="540" y="306" font-family="'Geist', sans-serif" font-size="9.5" fill="#2d3142">Verifies prompt alignment, factuality, and context budget.</text>

        <!-- Summary -->
        <rect x="528" y="336" width="416" height="132" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
        <text x="540" y="358" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="600" fill="#eb6c36">ARCHITECTURAL ROLE</text>
        <text x="540" y="378" font-family="'Geist', sans-serif" font-size="10" fill="#2d3142">Orchestrating hybrid enterprise workflows where structure</text>
        <text x="540" y="394" font-family="'Geist', sans-serif" font-size="10" fill="#2d3142">provides velocity while LLM reasoning handles ambiguity.</text>
        <text x="540" y="420" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" fill="#eb6c36">HYBRID DETERMINISTIC + NON-DETERMINISTIC HARNESS</text>

      </svg>
    </div>
  </div>
</body>
</html>
