<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The 3 Cognitive Pillars of AI Agent Memory</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-paper-2: #ececec;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #7a8399;
      --color-accent:  #eb6c36;
      --color-accent-tint: rgba(235,108,54,0.08);
      --color-rule:    rgba(45,49,66,0.12);
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1080px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.2vw + 0.8rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--color-muted);
      margin-bottom: 1.8rem;
      max-width: 720px;
      line-height: 1.45;
    }

    .card {
      background: #ffffff;
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 1.5rem;
    }

    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture & Cognitive Systems · Diagram Design</p>
    <h1>The 3 Cognitive Pillars of AI Agent Memory</h1>
    <p class="subtitle">How an agent harness bridges stateless LLM executions into a persistent cognitive system using procedural routines, durable semantic facts, and episodic event history.</p>

    <div class="card">
      <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="memory-pillars-title memory-pillars-desc">
        <title id="memory-pillars-title">The Three Pillars of AI Agent Memory</title>
        <desc id="memory-pillars-desc">System architecture showing Procedural, Semantic, and Episodic memory pillars feeding into the Agent Working Memory and Execution Loop.</desc>
        
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <!-- Background Container -->
        <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

        <!-- LEFT COLUMN: 3 MEMORY PILLARS -->
        <!-- Group Container for Memory Stores -->
        <rect x="40" y="40" width="280" height="460" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <text x="56" y="68" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#4f5d75" letter-spacing="0.14em">PERSISTENT COGNITIVE STORAGE</text>

        <!-- Pillar 1: Procedural -->
        <rect x="56" y="88" width="248" height="116" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="72" y="112" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#2d3142">1. Procedural Memory</text>
        <text x="72" y="130" font-family="'Geist Mono', monospace" font-size="9" fill="#7a8399">TYPE: SKILLS &amp; SOUL.MD</text>
        <text x="72" y="152" font-family="'Geist', sans-serif" font-size="10.5" fill="#4f5d75">Operational procedures, prompts,</text>
        <text x="72" y="168" font-family="'Geist', sans-serif" font-size="10.5" fill="#4f5d75">personas, execution workflows.</text>
        <rect x="72" y="178" width="84" height="16" rx="3" fill="rgba(45,49,66,0.06)"/>
        <text x="76" y="189" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">Trigger Loaded</text>

        <!-- Pillar 2: Semantic (Focal Highlight) -->
        <rect x="56" y="220" width="248" height="124" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="72" y="244" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#eb6c36">2. Semantic Memory</text>
        <text x="72" y="262" font-family="'Geist Mono', monospace" font-size="9" fill="#eb6c36">TYPE: MEMORY.MD &amp; FACTS</text>
        <text x="72" y="284" font-family="'Geist', sans-serif" font-size="10.5" fill="#2d3142">Durable truths, user preferences,</text>
        <text x="72" y="300" font-family="'Geist', sans-serif" font-size="10.5" fill="#2d3142">distilled knowledge across sessions.</text>
        <rect x="72" y="312" width="94" height="16" rx="3" fill="#eb6c36"/>
        <text x="76" y="323" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" fill="#ffffff">Consolidated Core</text>

        <!-- Pillar 3: Episodic -->
        <rect x="56" y="360" width="248" height="124" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="72" y="384" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#2d3142">3. Episodic Memory</text>
        <text x="72" y="402" font-family="'Geist Mono', monospace" font-size="9" fill="#7a8399">TYPE: STATE.DB &amp; LOGS</text>
        <text x="72" y="424" font-family="'Geist', sans-serif" font-size="10.5" fill="#4f5d75">Dated interactions, timestamps,</text>
        <text x="72" y="440" font-family="'Geist', sans-serif" font-size="10.5" fill="#4f5d75">raw conversation turn history.</text>
        <rect x="72" y="452" width="76" height="16" rx="3" fill="rgba(45,49,66,0.06)"/>
        <text x="76" y="463" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">Time Indexed</text>

        <!-- MIDDLE: RETRIEVAL & CONSOLIDATION GATES -->
        <!-- Retrieval Gate -->
        <rect x="368" y="160" width="168" height="96" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
        <text x="384" y="184" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Retrieval Gate</text>
        <text x="384" y="200" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75">SELECTIVE FILTER</text>
        <text x="384" y="222" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">Decides context budget &amp;</text>
        <text x="384" y="236" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">relevant skill/fact injection</text>

        <!-- Consolidation / Dreaming Daemon -->
        <rect x="368" y="320" width="168" height="96" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="384" y="344" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Consolidation Engine</text>
        <text x="384" y="360" font-family="'Geist Mono', monospace" font-size="8.5" fill="#4f5d75">"DREAMING" / ASYNC</text>
        <text x="384" y="382" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">Auxiliary LLM distills facts</text>
        <text x="384" y="396" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">from episodic state.db</text>

        <!-- RIGHT COLUMN: AGENT HARNESS (WAKU / HERMES) -->
        <rect x="584" y="40" width="336" height="460" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <text x="604" y="68" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#4f5d75" letter-spacing="0.14em">AGENT HARNESS (RUNTIME)</text>

        <!-- Working Memory Window -->
        <rect x="604" y="88" width="296" height="92" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="620" y="112" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Active Working Memory</text>
        <text x="620" y="128" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">CONTEXT WINDOW BUDGET</text>
        <text x="620" y="148" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">System Prompt (Soul) + Active Skills +</text>
        <text x="620" y="162" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">Distilled Facts + Current Conversation Turn</text>

        <!-- Execution Loop -->
        <rect x="604" y="200" width="296" height="152" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="620" y="224" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Agent Execution Loop</text>
        <text x="620" y="240" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">REASONING &amp; DISPATCH</text>
        
        <rect x="620" y="254" width="128" height="34" rx="4" fill="rgba(45,49,66,0.04)" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="630" y="275" font-family="'Geist Mono', monospace" font-size="9" fill="#2d3142">Tool Calling</text>

        <rect x="756" y="254" width="128" height="34" rx="4" fill="rgba(45,49,66,0.04)" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="764" y="275" font-family="'Geist Mono', monospace" font-size="9" fill="#2d3142">Subagent Spawn</text>

        <text x="620" y="316" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">Evaluates state, updates telemetry, and</text>
        <text x="620" y="330" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">triggers durable persistence.</text>

        <!-- Interaction / Environment -->
        <rect x="604" y="372" width="296" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="620" y="396" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">External I/O &amp; Environment</text>
        <text x="620" y="412" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">USER &amp; SYSTEM HOOKS</text>
        <text x="620" y="434" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">User Prompts, MCP Servers, External APIs,</text>
        <text x="620" y="448" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">Calendar, Terminal, File System.</text>

        <!-- CONNECTORS & FLOW LINES -->
        <!-- Storage to Retrieval Gate -->
        <path d="M 304 146 L 368 190" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 304 282 L 368 220" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        
        <!-- Retrieval Gate to Working Memory -->
        <path d="M 536 208 L 570 208 L 570 134 L 604 134" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- Working Memory to Execution Loop -->
        <path d="M 752 180 L 752 200" fill="none" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Execution Loop to Interaction -->
        <path d="M 752 352 L 752 372" fill="none" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Execution to Episodic Storage (Logging turn) -->
        <path d="M 604 428 L 550 428 L 550 422 L 304 422" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Episodic to Consolidation to Semantic -->
        <path d="M 304 440 L 336 440 L 336 368 L 368 368" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <path d="M 452 320 L 452 300 L 304 300" fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

        <!-- Editorial Aside -->
        <text x="352" y="476" font-family="'Instrument Serif', serif" font-style="italic" font-size="14" fill="#eb6c36">"Memory is what transforms a stateless prompt into an enduring partner."</text>
      </svg>
    </div>
  </div>
</body>
</html>
