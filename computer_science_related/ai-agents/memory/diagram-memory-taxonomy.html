<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The 3-Dimensional Agent Memory Taxonomy</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-paper-2: #ececec;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #7a8399;
      --color-accent:  #eb6c36;
      --color-accent-tint: rgba(235,108,54,0.08);
      --color-rule:    rgba(45,49,66,0.12);
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1120px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.2vw + 0.8rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--color-muted);
      margin-bottom: 1.8rem;
      max-width: 760px;
      line-height: 1.45;
    }

    .card {
      background: #ffffff;
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 1.5rem;
    }

    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Taxonomy & Framework · Diagram Design</p>
    <h1>The 3-Dimensional AI Agent Memory Taxonomy</h1>
    <p class="subtitle">Every agent memory system is defined by three fundamental axes: how information is structurally represented, how the runtime locates it, and how truth is maintained over time.</p>

    <div class="card">
      <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="taxonomy-title taxonomy-desc">
        <title id="taxonomy-title">3-Dimensional AI Agent Memory Taxonomy</title>
        <desc id="taxonomy-desc">Categorization of memory systems across Storage, Retrieval, and Lifecycle Maintenance axes.</desc>

        <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

        <!-- AXIS 1: WHAT IS IT? (STORAGE MODEL) -->
        <rect x="36" y="36" width="288" height="448" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="36" y="36" width="288" height="40" rx="6" fill="#ececec"/>
        <text x="52" y="60" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#2d3142" letter-spacing="0.12em">1. WHAT IS IT? (STORAGE)</text>
        <text x="52" y="94" font-family="'Geist', sans-serif" font-size="11" fill="#7a8399">Underlying data structures on disk/RAM</text>

        <!-- Item 1.1 Plain Text -->
        <rect x="52" y="112" width="256" height="76" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="64" y="132" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Plain Text &amp; Markdown</text>
        <text x="64" y="148" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">MEMORY.MD · SOUL.MD</text>
        <text x="64" y="166" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">Human-editable, zero dependencies, transparent.</text>

        <!-- Item 1.2 Relational Tables -->
        <rect x="52" y="196" width="256" height="76" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="64" y="216" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Relational Tables &amp; Rows</text>
        <text x="64" y="232" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">SQLITE STATE.DB · POSTGRES</text>
        <text x="64" y="250" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">Structured schemas, ACID logs, turn records.</text>

        <!-- Item 1.3 Vector Stores -->
        <rect x="52" y="280" width="256" height="76" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="64" y="300" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Vector Embeddings + Meta</text>
        <text x="64" y="316" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">SUPABASE PGVECTOR · PINECONE</text>
        <text x="64" y="334" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">High-dimensional spatial coordinates (1536-d).</text>

        <!-- Item 1.4 Knowledge Graphs -->
        <rect x="52" y="364" width="256" height="104" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="64" y="384" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#eb6c36">Relational &amp; Temporal Graphs</text>
        <text x="64" y="400" font-family="'Geist Mono', monospace" font-size="8.5" fill="#eb6c36">ZEP · MEM0 GRAPH · NODES + EDGES</text>
        <text x="64" y="418" font-family="'Geist', sans-serif" font-size="10" fill="#2d3142">Entities connected by semantic predicates.</text>
        <text x="64" y="432" font-family="'Geist', sans-serif" font-size="10" fill="#2d3142">Explicit relational reasoning over time.</text>
        <rect x="64" y="444" width="80" height="14" rx="2" fill="#eb6c36"/>
        <text x="68" y="454" font-family="'Geist Mono', monospace" font-size="7.5" font-weight="600" fill="#ffffff">Graph Topology</text>


        <!-- AXIS 2: HOW TO FIND IT? (RETRIEVAL MODEL) -->
        <rect x="356" y="36" width="288" height="448" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="356" y="36" width="288" height="40" rx="6" fill="#ececec"/>
        <text x="372" y="60" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#2d3142" letter-spacing="0.12em">2. HOW TO FIND IT? (RETRIEVAL)</text>
        <text x="372" y="94" font-family="'Geist', sans-serif" font-size="11" fill="#7a8399">Mechanisms for locating relevant records</text>

        <!-- Item 2.1 Preloaded Context -->
        <rect x="372" y="112" width="256" height="76" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="384" y="132" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Do Nothing (Preloaded Context)</text>
        <text x="384" y="148" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">ZERO RETRIEVAL OVERHEAD</text>
        <text x="384" y="166" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">Injected into system prompt by default.</text>

        <!-- Item 2.2 Keyword Search -->
        <rect x="372" y="196" width="256" height="76" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="384" y="216" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Keyword &amp; Lexical Search</text>
        <text x="384" y="232" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">SQLITE FTS5 · EXACT STRINGS</text>
        <text x="384" y="250" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">Sub-millisecond keyword BM25 ranking.</text>

        <!-- Item 2.3 Semantic Vector -->
        <rect x="372" y="280" width="256" height="76" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="384" y="300" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Semantic Vector Search</text>
        <text x="384" y="316" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">COSINE SIMILARITY · ANN</text>
        <text x="384" y="334" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">Finds conceptual matches across phrasing.</text>

        <!-- Item 2.4 GraphRAG Traversal -->
        <rect x="372" y="364" width="256" height="104" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="384" y="384" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Graph Traversal + Vector</text>
        <text x="384" y="400" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">HYBRID GRAPHRAG</text>
        <text x="384" y="418" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">Vector match seed nodes → traverse</text>
        <text x="384" y="432" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">neighboring relation edges for context.</text>


        <!-- AXIS 3: HOW TO MAINTAIN IT? (LIFECYCLE) -->
        <rect x="676" y="36" width="288" height="448" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="676" y="36" width="288" height="40" rx="6" fill="#ececec"/>
        <text x="692" y="60" font-family="'Geist Mono', monospace" font-size="10" font-weight="600" fill="#2d3142" letter-spacing="0.12em">3. HOW TO MAINTAIN? (LIFECYCLE)</text>
        <text x="692" y="94" font-family="'Geist', sans-serif" font-size="11" fill="#7a8399">Updating truth &amp; managing context entropy</text>

        <!-- Operation 1: Decision Logic -->
        <rect x="692" y="112" width="256" height="76" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="704" y="132" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Basic Mutation Gates</text>
        <text x="704" y="148" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">ADD · DELETE · OVERWRITE · NOOP</text>
        <text x="704" y="166" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">Deterministic delta resolution before write.</text>

        <!-- Operation 2: Temporal Invalidation / Superseding -->
        <rect x="692" y="196" width="256" height="88" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="704" y="216" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#eb6c36">Temporal Invalidation (Supersede)</text>
        <text x="704" y="232" font-family="'Geist Mono', monospace" font-size="8.5" fill="#eb6c36">NON-DESTRUCTIVE EVOLUTION</text>
        <text x="704" y="250" font-family="'Geist', sans-serif" font-size="10" fill="#2d3142">Invalidates outdated facts (e.g. 7PM→9PM)</text>
        <text x="704" y="264" font-family="'Geist', sans-serif" font-size="10" fill="#2d3142">while preserving historical telemetry.</text>

        <!-- Operation 3: Attribution -->
        <rect x="692" y="292" width="256" height="76" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="704" y="312" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Source Provenance (Attribute)</text>
        <text x="704" y="328" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">ORIGIN &amp; TRUST TRACING</text>
        <text x="704" y="346" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">Tracks origin: user prompt, tool, or web.</text>

        <!-- Operation 4: Dreaming / Consolidation -->
        <rect x="692" y="376" width="256" height="92" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="704" y="396" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Consolidation / "Dreaming"</text>
        <text x="704" y="412" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399">POST-PROCESSING REASONING</text>
        <text x="704" y="430" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">Idle-time distillation: deduplicates,</text>
        <text x="704" y="444" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">merges concepts, and distills truths.</text>

      </svg>
    </div>
  </div>
</body>
</html>
