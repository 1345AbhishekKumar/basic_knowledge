<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temporal Invalidation & The Consolidation "Dreaming" Loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-paper-2: #ececec;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #7a8399;
      --color-accent:  #eb6c36;
      --color-accent-tint: rgba(235,108,54,0.08);
      --color-rule:    rgba(45,49,66,0.12);
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1080px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.2vw + 0.8rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--color-muted);
      margin-bottom: 1.8rem;
      max-width: 760px;
      line-height: 1.45;
    }

    .card {
      background: #ffffff;
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 1.5rem;
    }

    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Lifecycle Protocols · Diagram Design</p>
    <h1>Temporal Invalidation &amp; The Consolidation "Dreaming" Loop</h1>
    <p class="subtitle">How modern agent harnesses manage evolving truth over time—superseding historical records without data loss, and running idle-time consolidation.</p>

    <div class="card">
      <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="temporal-loop-title temporal-loop-desc">
        <title id="temporal-loop-title">Temporal Invalidation and Memory Dreaming Lifecycle</title>
        <desc id="temporal-loop-desc">Comparison between destructive deletion and temporal superseding alongside the background consolidation cycle.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff" rx="8"/>

        <!-- SECTION A: THE DELETION VS SUPERSEDING COMPARISON -->
        <rect x="36" y="32" width="424" height="456" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <text x="52" y="60" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" fill="#4f5d75" letter-spacing="0.12em">A. HANDLING TRUTH OVER TIME</text>

        <!-- Case 1: Naive Overwrite / Deletion (Anti-pattern) -->
        <rect x="52" y="78" width="392" height="154" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="64" y="98" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">Naive Deletion / Direct Overwrite (Anti-Pattern)</text>
        <text x="64" y="114" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399">HARD OVERWRITE · LOSS OF TELEMETRY</text>
        
        <!-- Timeline boxes -->
        <rect x="64" y="128" width="168" height="42" rx="3" fill="rgba(45,49,66,0.05)" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="72" y="144" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399">DAY 25 [DELETED]</text>
        <text x="72" y="160" font-family="'Geist', sans-serif" font-size="9.5" fill="#7a8399" text-decoration="line-through">Waku reached 1,000 stars</text>

        <path d="M 232 149 L 260 149" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

        <rect x="264" y="128" width="168" height="42" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="272" y="144" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">DAY 26 [CURRENT]</text>
        <text x="272" y="160" font-family="'Geist', sans-serif" font-size="9.5" font-weight="600" fill="#2d3142">Waku reached 1.3k stars</text>

        <text x="64" y="200" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">Flaw: Destroys velocity context (+30% in 24h) and trend telemetry.</text>


        <!-- Case 2: Temporal Invalidation / Superseding (Recommended) -->
        <rect x="52" y="248" width="392" height="224" rx="4" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="64" y="268" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#eb6c36">Temporal Superseding (Recommended)</text>
        <text x="64" y="284" font-family="'Geist Mono', monospace" font-size="8" fill="#eb6c36">VALIDITY RANGES &amp; HISTORICAL SURVIVAL</text>

        <!-- Epoch 1 -->
        <rect x="64" y="298" width="368" height="52" rx="3" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="76" y="316" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399">EPOCH t0 (18:00): [STATUS: SUPERSEDED / OUTDATED]</text>
        <text x="76" y="332" font-family="'Geist', sans-serif" font-size="10" fill="#4f5d75">"Elon Musk will arrive at 7:00 PM for the dinner party."</text>
        <rect x="340" y="310" width="80" height="14" rx="2" fill="rgba(45,49,66,0.06)"/>
        <text x="344" y="320" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399">Valid: 18:00-18:45</text>

        <!-- Epoch 2 (Active) -->
        <rect x="64" y="360" width="368" height="58" rx="3" fill="#ffffff" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="76" y="378" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" fill="#eb6c36">EPOCH t1 (18:45): [STATUS: ACTIVE TRUTH]</text>
        <text x="76" y="394" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142">"Elon Musk updated arrival time: will arrive at 9:00 PM."</text>
        <rect x="340" y="372" width="80" height="14" rx="2" fill="#eb6c36"/>
        <text x="344" y="382" font-family="'Geist Mono', monospace" font-size="7.5" font-weight="600" fill="#ffffff">Valid: 18:45-NOW</text>

        <text x="64" y="442" font-family="'Geist', sans-serif" font-size="9.5" fill="#2d3142">Result: Active queries return 9:00 PM; history explains why it shifted.</text>


        <!-- SECTION B: CONSOLIDATION & DREAMING CYCLE -->
        <rect x="496" y="32" width="428" height="456" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
        <text x="512" y="60" font-family="'Geist Mono', monospace" font-size="9.5" font-weight="600" fill="#4f5d75" letter-spacing="0.12em">B. THE CONSOLIDATION "DREAMING" LOOP</text>

        <!-- Step 1: Online Execution -->
        <rect x="512" y="78" width="396" height="88" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="524" y="98" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">1. Online Interaction (High Velocity)</text>
        <text x="524" y="114" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399">USER TURNS · TOOL DISPATCH · FAST LOGGING</text>
        <text x="524" y="132" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">The active agent runs fast, appending raw conversation turns and</text>
        <text x="524" y="146" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">tool execution traces directly into episodic storage (state.db).</text>

        <path d="M 710 166 L 710 188" fill="none" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Step 2: Idle Dreaming -->
        <rect x="512" y="188" width="396" height="114" rx="4" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="524" y="208" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#eb6c36">2. Idle Consolidation ("Dreaming" Phase)</text>
        <text x="524" y="224" font-family="'Geist Mono', monospace" font-size="8" fill="#eb6c36">AUXILIARY LLM · OFF-PEAK POSTMORTEM</text>
        <text x="524" y="244" font-family="'Geist', sans-serif" font-size="9.5" fill="#2d3142">Runs scheduled batch distillation across recent unmerged turns:</text>
        <text x="532" y="260" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2d3142">• Drops ephemeral chatter (greetings, syntax formatting)</text>
        <text x="532" y="274" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2d3142">• Merges duplicate entity references</text>
        <text x="532" y="288" font-family="'Geist Mono', monospace" font-size="8.5" fill="#2d3142">• Resolves conflicting temporal timestamps</text>

        <path d="M 710 302 L 710 324" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- Step 3: Distilled Storage -->
        <rect x="512" y="324" width="396" height="88" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="524" y="344" font-family="'Geist', sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">3. Durable Semantic Output (Clean Signal)</text>
        <text x="524" y="360" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399">MEMORY.MD · REFINED KNOWLEDGE GRAPH</text>
        <text x="524" y="378" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">Outputs clean, atomic facts ready for prompt injection</text>
        <text x="524" y="392" font-family="'Geist', sans-serif" font-size="9.5" fill="#4f5d75">or indexed vector/graph retrieval on the next session.</text>

        <!-- Dynamic Loop Arrow back to 1 -->
        <path d="M 908 368 L 932 368 L 932 122 L 908 122" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Annotation -->
        <text x="520" y="456" font-family="'Instrument Serif', serif" font-style="italic" font-size="13.5" fill="#eb6c36">"Dreaming compresses hundreds of raw conversational turns into atomic, durable signal."</text>
      </svg>
    </div>
  </div>
</body>
</html>
